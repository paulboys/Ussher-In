name: Protect Critical CI/OCR Files

on:
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - '08_working_scratch/pipeline_scripts/pilot_ocr.py'
      - '08_working_scratch/pipeline_scripts/text_normalization.py'

jobs:
  review-critical-changes:
    name: critical-file-review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Summarize critical changes
        run: |
          git fetch origin main --depth=1
          echo "## Critical File Change Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The following protected files changed in this PR:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          changed_files=$(git diff --name-only origin/main...HEAD -- \
            .github/workflows/ci.yml \
            08_working_scratch/pipeline_scripts/pilot_ocr.py \
            08_working_scratch/pipeline_scripts/text_normalization.py)

          if [ -z "$changed_files" ]; then
            echo "- None detected" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          while IFS= read -r file; do
            echo "- $file" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$changed_files"

      - name: Fail if required CI jobs are removed
        run: |
          set -e
          git fetch origin main --depth=1
          if git diff origin/main...HEAD -- .github/workflows/ci.yml | grep -E '^-\s+name:\s+pytest$'; then
            echo "::error::Required CI check name 'pytest' appears to be removed/renamed. Keep it stable for branch protection."
            exit 1
          fi

      - name: Require explicit review note reminder
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> Reminder: This PR modifies critical CI/OCR files. Include rationale and rollback plan in PR discussion." >> "$GITHUB_STEP_SUMMARY"

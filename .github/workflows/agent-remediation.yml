name: Agent Remediation

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: agent-remediation-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  remediate:
    name: remediate-failed-ci
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'dev' && github.event.workflow_run.head_repository.full_name == github.repository && !startsWith(github.event.workflow_run.head_branch, 'agent/fix-run-') }}
    runs-on: [self-hosted, windows]
    timeout-minutes: 30

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Configure git identity
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ensure prerequisites
        shell: pwsh
        run: |
          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) { throw "gh CLI not found on self-hosted runner" }
          if (-not (Get-Command claude -ErrorAction SilentlyContinue)) { throw "claude CLI not found on self-hosted runner" }

      - name: Run agent loop
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_agent_loop.ps1 -BaseBranch dev -DefaultBranch main -MaxFixAttempts 1

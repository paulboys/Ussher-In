name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('06_tools_config/python_env_requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r 06_tools_config/python_env_requirements.txt

      - name: Run tests
        run: |
          python -m pytest 08_working_scratch/tests -q

  lint_type_optional:
    name: lint-type (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('06_tools_config/python_env_requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r 06_tools_config/python_env_requirements.txt
          python -m pip install ruff mypy

      - name: Run ruff lint
        run: |
          python -m ruff check 08_working_scratch/pipeline_scripts 08_working_scratch/phase3b/scripts 08_working_scratch/tests

      - name: Run mypy type check
        run: |
          python -m mypy 08_working_scratch/pipeline_scripts 08_working_scratch/phase3b/scripts --ignore-missing-imports

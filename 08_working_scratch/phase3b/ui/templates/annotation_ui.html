<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phase3b Annotator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='annotation_ui.css') }}">
</head>
<body>
  <header class="topbar">
    <h1>Phase3b Annotator</h1>
    <div class="controls">
      <label for="pageSelect">Page</label>
      <select id="pageSelect">
        {% for page in pages %}
        <option value="{{ page }}">{{ page }}</option>
        {% endfor %}
      </select>
      <button id="loadBtn" type="button">Load</button>
      <button id="saveBtn" type="button">Save</button>
      <span id="status" class="status"></span>
    </div>
  </header>

  <section class="glyph-bar" id="glyphBar">
    <span class="glyph-label">Glyph tools</span>
    <button type="button" data-glyph="æ" title="Alt+e">æ</button>
    <button type="button" data-glyph="Æ" title="Alt+Shift+E">Æ</button>
    <button type="button" data-glyph="œ" title="Alt+o">œ</button>
    <button type="button" data-glyph="Œ" title="Alt+Shift+O">Œ</button>
    <button type="button" data-glyph="Ↄ" title="Alt+6">Ↄ</button>
    <button type="button" data-glyph="ↄ" title="Alt+7">ↄ</button>
    <button type="button" data-glyph="ↀ">ↀ</button>
    <button type="button" data-glyph="ↁ">ↁ</button>
    <button type="button" data-glyph="ↂ">ↂ</button>
    <div class="superscript-entry-row">
      <span class="glyph-label">Superscript entry</span>
      <input id="superscriptInput" class="glyph-entry" type="text" maxlength="10" placeholder="">
      <button id="insertSuperscriptRawBtn" type="button" title="Insert exactly as typed">Insert raw</button>
      <button id="insertSuperscriptBtn" type="button" title="Convert to superscript where available, then insert">Insert superscript</button>
    </div>
  </section>

  <main class="layout">
    <section class="editor-pane">
      <h2>Page metadata</h2>
      <div class="meta-grid">
        <label>Reviewer <input id="metaReviewer" type="text" readonly></label>
        <label>Annotation status <input id="metaAnnotationStatus" type="text"></label>
        <label>Review status
          <select id="metaReviewStatus">
            <option value="draft">draft</option>
            <option value="reviewed">reviewed</option>
            <option value="locked">locked</option>
          </select>
        </label>
      </div>
      <label>Notes
        <textarea id="metaNotes" rows="2"></textarea>
      </label>

      <h2>Header indicators</h2>
      <div class="meta-grid header-indicator-grid">
        <label>Derived page number
          <input id="derivedContainsHeaderPageNumber" type="text" readonly>
        </label>
        <label>Derived chapter indicator
          <input id="derivedContainsHeaderChapterNumber" type="text" readonly>
        </label>
        <label>Derived parity consistent
          <input id="derivedHeaderParityConsistent" type="text" readonly>
        </label>
        <label>Derived page number side
          <input id="derivedHeaderPageNumberSide" type="text" readonly>
        </label>
        <label>Derived chapter side
          <input id="derivedHeaderChapterSide" type="text" readonly>
        </label>
      </div>
      <div class="override-grid">
        <label class="inline-check"><input id="overrideContainsHeaderPageNumberEnabled" type="checkbox"> Override page number flag</label>
        <label class="inline-check"><input id="overrideContainsHeaderPageNumberValue" type="checkbox"> Value</label>

        <label class="inline-check"><input id="overrideContainsHeaderChapterNumberEnabled" type="checkbox"> Override chapter flag</label>
        <label class="inline-check"><input id="overrideContainsHeaderChapterNumberValue" type="checkbox"> Value</label>

        <label class="inline-check"><input id="overrideHeaderParityConsistentEnabled" type="checkbox"> Override parity flag</label>
        <label class="inline-check"><input id="overrideHeaderParityConsistentValue" type="checkbox"> Value</label>

        <label class="inline-check"><input id="overrideHeaderPageNumberSideEnabled" type="checkbox"> Override page side</label>
        <label>Value
          <select id="overrideHeaderPageNumberSideValue">
            <option value=""></option>
            <option value="left">left</option>
            <option value="right">right</option>
          </select>
        </label>

        <label class="inline-check"><input id="overrideHeaderChapterSideEnabled" type="checkbox"> Override chapter side</label>
        <label>Value
          <select id="overrideHeaderChapterSideValue">
            <option value=""></option>
            <option value="left">left</option>
            <option value="right">right</option>
          </select>
        </label>
      </div>

      <div class="section-head">
        <h2>Header lines</h2>
        <button id="addHeaderBtn" type="button" class="small-btn">+ Header line</button>
      </div>
      <div id="headerTable"></div>

      <h2>Body lines</h2>
      <div id="bodyTable"></div>

      <div class="section-head">
        <h2>Footnote lines</h2>
        <button id="addFootnoteBtn" type="button" class="small-btn">+ Footnote line</button>
      </div>
      <div id="footnoteTable"></div>
    </section>

    <section class="pdf-pane">
      <h2>Source PDF</h2>
      <iframe id="pdfFrame" title="Source PDF"></iframe>
    </section>
  </main>

  <script>
    window.__PAGES__ = {{ pages|tojson }};
  </script>
  <script src="{{ url_for('static', filename='annotation_ui.js') }}"></script>
</body>
</html>

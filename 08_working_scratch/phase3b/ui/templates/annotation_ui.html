<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phase3b Annotator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='annotation_ui.css') }}">
</head>
<body>
  <header class="topbar">
    <h1>Phase3b Annotator</h1>
    <div class="controls">
      <label for="pageSelect">Page</label>
      <select id="pageSelect">
        {% for page in pages %}
        <option value="{{ page }}">{{ page }}</option>
        {% endfor %}
      </select>
      <button id="loadBtn" type="button">Load</button>
      <button id="saveBtn" type="button">Save</button>
      <span id="status" class="status"></span>
    </div>
  </header>

  <section class="ocr-bar" id="ocrBar">
    <span class="glyph-label">Run OCR</span>
    <label for="ocrPdfSelect">PDF</label>
    <select id="ocrPdfSelect"></select>
    <label for="ocrPageInput">Page</label>
    <input id="ocrPageInput" type="number" min="1" value="1" style="width: 5em">
    <label for="ocrPartSelect">Part</label>
    <select id="ocrPartSelect">
      <option value="part1">part1</option>
      <option value="part2">part2</option>
    </select>
    <label><input id="ocrOverwrite" type="checkbox"> Overwrite</label>
    <button id="ocrRunBtn" type="button">Run Gemini OCR</button>
    <span id="ocrStatus" class="status"></span>
  </section>

  <section class="glyph-bar" id="glyphBar">
    <span class="glyph-label">Glyph tools</span>
    <button type="button" data-glyph="æ" title="Alt+e">æ</button>
    <button type="button" data-glyph="Æ" title="Alt+Shift+E">Æ</button>
    <button type="button" data-glyph="œ" title="Alt+o">œ</button>
    <button type="button" data-glyph="Œ" title="Alt+Shift+O">Œ</button>
    <button type="button" data-glyph="Ↄ" title="Alt+6">Ↄ</button>
    <button type="button" data-glyph="ↄ" title="Alt+7">ↄ</button>
    <button type="button" data-glyph="ↀ">ↀ</button>
    <button type="button" data-glyph="ↁ">ↁ</button>
    <button type="button" data-glyph="ↂ">ↂ</button>
    <div class="superscript-entry-row">
      <span class="glyph-label">Superscript entry</span>
      <input id="superscriptInput" class="glyph-entry" type="text" maxlength="10" placeholder="">
      <button id="insertSuperscriptRawBtn" type="button" title="Insert exactly as typed">Insert raw</button>
      <button id="insertSuperscriptBtn" type="button" title="Convert to superscript where available, then insert">Insert superscript</button>
    </div>
  </section>

  <main class="layout">
    <section class="editor-pane">
      <section class="meta-card">
        <h2>Page metadata</h2>
        <div class="meta-grid">
          <label>Page #
            <input id="metaPageNum" type="number" min="1">
          </label>
          <label>Source PDF
            <input id="metaSourcePdf" type="text">
          </label>
          <label>Annotation status
            <input id="metaAnnotationStatus" type="text">
          </label>
          <label>Review status
            <select id="metaReviewStatus">
              <option value="draft">draft</option>
              <option value="reviewed">reviewed</option>
              <option value="locked">locked</option>
            </select>
          </label>
          <label>Reviewer
            <input id="metaReviewer" type="text" readonly>
          </label>
        </div>
        <label>OCR page summary
          <textarea id="metaOcrPageSummary" rows="2"></textarea>
        </label>
        <label>Notes
          <textarea id="metaNotes" rows="2"></textarea>
        </label>
        <div class="meta-provenance">
          <span class="meta-prov-label">Engine</span>
          <span id="metaOcrEngine" class="meta-prov-value">&mdash;</span>
          <span class="meta-prov-label">Model</span>
          <span id="metaOcrModel" class="meta-prov-value">&mdash;</span>
          <span class="meta-prov-label">Lang</span>
          <span id="metaOcrLang" class="meta-prov-value">&mdash;</span>
        </div>
      </section>

      <section class="region-section" id="headerSection">
        <div class="section-head">
          <h2>Header</h2>
          <button id="addHeaderBtn" type="button" class="small-btn">+ Header line</button>
        </div>
        <div id="headerContainer"></div>
      </section>

      <section class="region-section" id="bodySection">
        <div class="section-head">
          <h2>Body &amp; Marginalia</h2>
          <button id="addBodyBtn" type="button" class="small-btn">+ Body line</button>
        </div>
        <div id="unanchoredMarginaliaContainer" class="unanchored-marginalia"></div>
        <div id="bodyContainer" class="body-grid"></div>
      </section>

      <section class="region-section" id="footnoteSection">
        <div class="section-head">
          <h2>Footnotes</h2>
          <button id="addFootnoteBtn" type="button" class="small-btn">+ Footnote</button>
        </div>
        <div id="footnoteContainer"></div>
      </section>

      <section class="region-section" id="catchwordSection">
        <div class="section-head">
          <h2>Catchword</h2>
          <button id="addCatchwordBtn" type="button" class="small-btn">+ Catchword</button>
        </div>
        <div id="catchwordContainer"></div>
      </section>
    </section>

    <section class="pdf-pane">
      <header class="pdf-pane-header">
        <h2>Source PDF</h2>
        <div class="pdf-pane-meta">
          <span class="pdf-pane-meta-label">File</span>
          <span id="pdfPaneSourceName" class="pdf-pane-meta-value" title="">&mdash;</span>
          <span class="pdf-pane-meta-label">Page</span>
          <span id="pdfPanePageNum" class="pdf-pane-meta-value">&mdash;</span>
        </div>
      </header>
      <iframe id="pdfFrame" title="Source PDF"></iframe>
    </section>
  </main>

  <script>
    window.__PAGES__ = {{ pages|tojson }};
  </script>
  <script src="{{ url_for('static', filename='annotation_ui.js') }}"></script>
</body>
</html>
